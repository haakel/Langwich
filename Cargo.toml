[package]
name = "langwich"
version = "1.2.0"
edition = "2021"
authors = ["haakel"]
description = "Smart Persian ↔ English keyboard layout converter"
readme = "README.md"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[dependencies]
# Async runtime
tokio = { version = "1.37", features = ["full", "rt-multi-thread"] }

# GUI framework (egui + eframe)
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui = "0.29"

# Windows API bindings
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_UpdateAgent",
    "Win32_System_WinRT",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Notifications",
] }

# Tray icon
tray-icon = { version = "0.16", default-features = false }

# Clipboard management
winapi = { version = "0.3", features = ["winuser", "winbase"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Unicode handling
unicode-normalization = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Cross-platform thread synchronization
parking_lot = "0.12"

[[bin]]
name = "langwich"
path = "src/main.rs"

[build-dependencies]
cc = "1.0"
